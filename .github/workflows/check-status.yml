name: check-status

# Vercel Hobby roda cron 1x por dia; a cadencia real de monitoramento vem daqui.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar verificacao de status
        run: |
          code=$(curl -s -o /tmp/body.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.DASHBOARD_URL }}/api/cron/check-status")
          cat /tmp/body.txt
          if [ "$code" != "200" ]; then
            echo "::error::check-status devolveu HTTP $code"
            exit 1
          fi
